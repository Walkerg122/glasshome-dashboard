                  target:
                    entity_id: "[[scenes.film]]"
                hold_action:
                  action: navigate
                  navigation_path: /config/scene/dashboard
                card_mod:
                  style: |
                    ha-card { border-radius: 24px !important; }
                optional: true
              - type: tile
                entity: "[[scenes.all_off]]"
