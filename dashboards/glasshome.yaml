  - title: Schedules
    path: lights-schedules
    type: sections
    max_columns: 2
    theme: glasshome
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |-
              # Schedules
              Automatic on and off times for your lights
            card_mod:
              style:
                .: |
                  ha-card { background: none; box-shadow: none; border: none; }
                ha-markdown$: |
                  h1 { font-size: clamp(25px, 7.2vw, 34px); font-weight: 700; letter-spacing: -0.5px; margin: 0; color: #ffffff; }
                  p { font-size: clamp(14px, 4.1vw, 17px); color: #98989f; margin: 4px 0 0; }
            grid_options:
              columns: 18
          - type: custom:glasshome-nav-card
            variant: links
            links:
              - name: Back to Lights
                icon: mdi:arrow-left
                path: /glass-home/lights
            grid_options:
              columns: 6
              rows: 1
          - type: custom:glasshome-slot-card
            grid_options:
              columns: full
            card:
              type: markdown
              content: |-
                {%- set autos = states.automation | list -%}
                {%- if autos -%}
                {%- for a in autos | sort(attribute='name') -%}
                <ha-icon icon="{{ 'mdi:clock-check-outline' if a.state == 'on' else 'mdi:clock-remove-outline' }}"></ha-icon>**{{ a.name }}** · {{ 'Active' if a.state == 'on' else 'Paused' }} · {{ ('last ran ' ~ relative_time(a.attributes.last_triggered) ~ ' ago') if a.attributes.last_triggered else 'not run yet' }}

                {%- endfor -%}
                {%- else -%}
                <ha-icon icon="mdi:clock-outline"></ha-icon>**No schedules yet.** Nothing in Home Assistant turns these lights on or off automatically.

                Tap **New schedule**, choose a time (or sunset) as the trigger and a light as the action, for example *at 18:00 turn on Living Room Light at 60%* or *at 23:30 turn off Hallway Light*.
                {%- endif -%}
              card_mod:
                style:
                  .: |
                    ha-card { padding: 8px 6px; }
                  ha-markdown$: |
                    p { margin: 6px 0; font-size: 16px; line-height: 1.45; color: #98989f; }
                    strong { color: #ffffff; }
                    ha-icon { --mdc-icon-size: 20px; margin-right: 8px; vertical-align: -3px; color: #98989f; }
                    ha-icon[icon="mdi:check-circle"] { color: #30d158; }
                    ha-icon[icon="mdi:alert-circle"], ha-icon[icon="mdi:cctv-off"] { color: #ff9f0a; }
                    ha-icon[icon="mdi:clock-check-outline"] { color: #30d158; }
              demo: false
          - type: button
            name: New schedule
            icon: mdi:plus
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /config/automation/edit/new
            card_mod:
              style: |
                ha-card { flex-direction: row !important; justify-content: center; align-items: center; gap: 6px; padding: 0 10px !important; font-size: 14px; font-weight: 600; height: 44px !important; margin-top: 8px; }
                ha-state-icon { width: 20px !important; height: 20px !important; --mdc-icon-size: 20px; flex: none; }
            grid_options:
              columns: 12
              rows: 1
          - type: custom:glasshome-nav-card
            variant: links
            links:
              - name: Edit schedules
                icon: mdi:pencil
                path: /config/automation/dashboard
            grid_options:
              columns: 12
              rows: 1
          - type: custom:glasshome-nav-card
            variant: bar
            active: lights
            grid_options:
              columns: full
