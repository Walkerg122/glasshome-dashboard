                    ha-card { height: 92px; border-radius: 24px !important; font-size: 15px; font-weight: 600; --mdc-icon-size: 24px; gap: 6px; justify-content: center; }
                    ha-state-icon { color: #c4b5fd; background: rgba(196,181,253,0.15); border-radius: 50%; width: 44px !important; box-shadow: 0 0 14px rgba(196,181,253,0.18); display: flex; align-items: center; justify-content: center; }
                optional: true
              - type: button
                name: All off
                icon: mdi:lightbulb-group-off-outline
                show_state: false
                tap_action:
