                    .: |
                      ha-card { background: radial-gradient(90% 150% at 100% 0%, rgba(255,196,90,0.40) 0%, transparent 60%), linear-gradient(160deg, #34296a 0%, #241c4c 50%, #161230 100%); border: none; border-radius: 24px !important; padding: 6px 8px; }
                    ha-markdown$: |
