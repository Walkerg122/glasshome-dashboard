# Glass Home dashboard (YAML mode). Install it as /config/glasshome/dashboard.yaml at the dashboard
# URL "glass-home" (see docs/install.md). Every [[token]] is filled in from the glasshome: section below,
# which reads your own settings from /config/glasshome/config.yaml. That file is never served publicly:
# the cards read it over your signed-in Home Assistant connection. Nothing personal lives in this file.
# Cards whose settings are missing show a setup placeholder; switched-off features are left out.
# Open /glass-home/setup for the setup checklist.
# Storage-mode (UI) dashboards: paste the contents of config.yaml under glasshome: instead of !include.

glasshome: !include config.yaml

kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_menubutton: true
    hide_search: true
    hide_assistant: true
    hide_notifications: true
    hide_settings: true
    hide_account: true
    hide_edit_dashboard: true
    block_overflow: true
    hide_dialog_header_settings: true
    hide_dialog_header_overflow: true
    ignore_disable_km: true
title: Glass Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: panel
    theme: glasshome
    cards:
      - type: custom:glasshome-pager-card
        start: home
        pages:
          - id: media
            title: Media
            icon: mdi:television-play
            accent: "#a78bfa"
            cards:
              - type: markdown
                content: |-
                  {%- set tv = '[[?media.tv]]' -%}
                  # [[_page.media]]
                  {% if tv %}TV · **{{ states(tv) | replace('_', ' ') | title }}**{{ (' · ' ~ state_attr(tv, 'media_title')) if state_attr(tv, 'media_title') else '' }}{% endif %}

                  [[?_page.media_sub]]
                span: 12
                card_mod:
                  style:
                    .: |
                      ha-card { background: radial-gradient(90% 150% at 100% 0%, rgba(255,95,162,0.40) 0%, transparent 60%), linear-gradient(160deg, #34296a 0%, #241c4c 50%, #161230 100%); border: none; border-radius: 24px !important; padding: 6px 8px; }
                    ha-markdown$: |
                      h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -1px; color: #fff; line-height: 1.05; }
                      h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.85); }
                      p { margin: 8px 0 0; font-size: 17px; color: rgba(255,255,255,0.82); line-height: 1.4; }
                      strong { color: #fff; }
              - type: custom:glasshome-spotify-card
                span: 12
                entity: "[[media.spotify]]"
                device: "[[media.spotify_device]]"
                device_label: "[[?media.spotify_device_label]]"
                device_note: "[[?media.spotify_device_note]]"
                tv: "[[?media.tv_cast]]"
                app: com.spotify.tv.android
                volume_level_entity: "[[?media.tv]]"
                rows: 2
                feature: spotify
                setup_label: Spotify
              - type: custom:glasshome-music-card
                span: 12
                entity: "[[media.music.player]]"
                service: "[[?media.music.service]]"
                rows: 2
                feature: music
                setup_label: Music
              - type: button
                name: Volume −
                icon: mdi:volume-minus
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_down
                  target:
                    entity_id: "[[media.tv_cast]]"
                span: 4
                icon_height: 44px
                card_mod:
                  style: |
                    ha-card { height: 92px; border-radius: 24px !important; font-size: 15px; font-weight: 600; --mdc-icon-size: 24px; gap: 6px; justify-content: center; }
                    ha-state-icon { color: #ff7ab6; background: rgba(255,122,182,0.15); border-radius: 50%; width: 44px !important; box-shadow: 0 0 14px rgba(255,122,182,0.18); display: flex; align-items: center; justify-content: center; }
                show_name: false
                height: 92
                optional: true
              - type: button
                name: Volume +
                icon: mdi:volume-plus
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: media_player.volume_up
                  target:
                    entity_id: "[[media.tv_cast]]"
                span: 4
                icon_height: 44px
                card_mod:
                  style: |
                    ha-card { height: 92px; border-radius: 24px !important; font-size: 15px; font-weight: 600; --mdc-icon-size: 24px; gap: 6px; justify-content: center; }
                    ha-state-icon { color: #ff7ab6; background: rgba(255,122,182,0.15); border-radius: 50%; width: 44px !important; box-shadow: 0 0 14px rgba(255,122,182,0.18); display: flex; align-items: center; justify-content: center; }
                show_name: false
                height: 92
                optional: true
              - type: custom:glasshome-tv-power-card
                name: TV Power
                remote: "[[media.tv_remote]]"
                script: "[[media.tv_power_script]]"
                icon_only: true
                span: 4
                height: 92
                feature: tv_power
              - type: tile
                entity: "[[scenes.film]]"
                name: Film
                icon: mdi:movie-open-outline
                color: amber
                span: 6
                state_content:
                  - last_changed
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: "[[scenes.film]]"
                hold_action:
                  action: navigate
                  navigation_path: /config/scene/dashboard
                card_mod:
                  style: |
                    ha-card { border-radius: 24px !important; }
                vertical: true
                height: 112
                optional: true
              - type: tile
                entity: "[[scenes.evening]]"
                name: Evening
                icon: mdi:weather-sunset
                color: amber
                span: 6
                state_content:
                  - last_changed
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: "[[scenes.evening]]"
                hold_action:
                  action: navigate
                  navigation_path: /config/scene/dashboard
                card_mod:
                  style: |
                    ha-card { border-radius: 24px !important; }
                vertical: true
                height: 112
                optional: true
            feature: media|spotify|music
          - id: security
            title: Security
            icon: mdi:shield-home-outline
            accent: "#a78bfa"
            cards:
              - type: markdown
                content: |-
                  {%- set cams = [[cctv.cameras|json]] -%}
                  {%- set up = cams | map(attribute='entity') | reject('is_state', 'unavailable') | reject('is_state', 'unknown') | list | count -%}
                  # Security
                  **{{ up }}/{{ cams | count }}** cameras online{% if '[[?presence.person]]' %} · {{ state_attr('[[?presence.person]]', 'friendly_name') }} {{ 'home' if is_state('[[?presence.person]]', 'home') else 'away' }}{% endif %}
                span: 12
                card_mod:
                  style:
                    .: |
                      ha-card { background: radial-gradient(90% 150% at 100% 0%, rgba(255,107,107,0.38) 0%, transparent 60%), linear-gradient(160deg, #34296a 0%, #241c4c 50%, #161230 100%); border: none; border-radius: 24px !important; padding: 6px 8px; }
                    ha-markdown$: |
                      h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -1px; color: #fff; line-height: 1.05; }
                      h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.85); }
                      p { margin: 8px 0 0; font-size: 17px; color: rgba(255,255,255,0.82); line-height: 1.4; }
                      strong { color: #fff; }
              - type: custom:glasshome-camera-card
                span: 12
                cameras: "[[cctv.cameras]]"
                setup_label: Cameras
            feature: cctv
          - id: lights
            title: Lights
            icon: mdi:lightbulb-outline
            accent: "#a78bfa"
            cards:
