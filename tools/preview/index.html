<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Home preview</title>
<style>
  :root {
    --primary-background-color: #120d22; --secondary-background-color: #1d1733; --primary-text-color: #fff; --secondary-text-color: #a29db8;
    --primary-color: #8b5cf6; --accent-color: #a78bfa; --divider-color: rgba(255,255,255,0.08);
    --ha-card-background: linear-gradient(160deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.025) 100%), rgba(26,20,46,0.62);
    --ha-card-border-radius: 24px; --ha-card-border-color: rgba(255,255,255,0.08); --ha-card-box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    --mdc-icon-size: 24px; --card-background-color: #1d1733;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; min-height: 100%; background: #120d22 url("/local/glasshome/bg.svg") center / cover no-repeat fixed; color: #fff; }
  #view.sections { box-sizing: border-box; padding: 16px; max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
  .section { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-content: start; min-width: 0; }
  .section > * { min-width: 0; }
  #view.panel { height: 100vh; }
  .demo-flag { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 99; font-size: 11px; letter-spacing: 0.4px; color: #c4b5fd;
    background: rgba(18,13,34,0.8); border: 1px solid rgba(167,139,250,0.4); border-radius: 10px; padding: 2px 10px; pointer-events: none; }
</style>
</head>
<body>
<div class="demo-flag">PREVIEW · FICTIONAL DEMO DATA</div>
<div id="view"></div>
<script type="module" src="/tools/preview/preview.js"></script>
</body>
</html>
